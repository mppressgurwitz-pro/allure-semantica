<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body { font-family: Arial, sans-serif; padding: 12px; }
    .panel { background: #f7f7f9; border: 1px solid #e3e3e8; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    button { background: #1a73e8; color: white; border: 0; padding: 9px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; width: 100%; }
    button:disabled { background: #9aa0a6; cursor: not-allowed; }
    .step { margin: 6px 0; font-size: 13px; }
    .step.ok::before { content: "✓ "; color: #137333; }
    .step.err::before { content: "✗ "; color: #c5221f; }
    .bar { height: 4px; background: #e3e3e8; border-radius: 2px; overflow: hidden; margin: 8px 0; }
    .bar > div { height: 100%; background: #1a73e8; width: 0; transition: width 0.3s; }
    input[type=file] { width: 100%; font-size: 12px; }
    .mode { display: flex; gap: 6px; margin-bottom: 8px; }
    .mode label { flex: 1; border: 1px solid #dadce0; border-radius: 6px; padding: 8px; cursor: pointer; font-size: 12px; text-align: center; background: #fff; }
    .mode input { display: none; }
    .field { margin: 8px 0; }
    .field label { display: block; font-size: 11px; color: #5f6368; margin-bottom: 3px; }
    .field input[type=text] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid #dadce0; border-radius: 4px; }
    .copy-fields { display: none; }
    .copy-fields.shown { display: block; }
  </style>
</head>
<body>
  <h2>🤖 Конкурентный анализ WB</h2>
  <div class="panel">
    <div class="mode">
      <label><input type="radio" name="mode" value="inplace" checked><span>🔄 Эта таблица</span></label>
      <label><input type="radio" name="mode" value="copy"><span>🆕 Новая копия</span></label>
    </div>
    <div class="copy-fields" id="copyFields">
      <div class="field"><label>Название</label><input type="text" id="productName"></div>
      <div class="field"><label>Артикул WB</label><input type="text" id="ourSku"></div>
    </div>
    <div class="field"><label>Файл WB (.xlsx)</label><input type="file" id="file" accept=".xlsx" /></div>
    <button id="btnRun" onclick="run()" disabled>Загрузить</button>
  </div>
  <div class="panel">
    <div class="bar"><div id="bar"></div></div>
    <div id="log"></div>
  </div>
  <script>
    const f = document.getElementById('file');
    const btn = document.getElementById('btnRun');
    const log = document.getElementById('log');
    const bar = document.getElementById('bar');
    const cf = document.getElementById('copyFields');
    let chosen = null;
    document.querySelectorAll('input[name=mode]').forEach(r => {
      r.addEventListener('change', () => { cf.classList.toggle('shown', r.value === 'copy' && r.checked); validate(); });
    });
    f.addEventListener('change', () => { chosen = f.files[0] || null; validate(); });
    function getMode() { return document.querySelector('input[name=mode]:checked').value; }
    function validate() {
      let ok = !!chosen;
      if (getMode() === 'copy') ok = ok && document.getElementById('productName').value.trim() && document.getElementById('ourSku').value.trim();
      btn.disabled = !ok;
    }
    function step(m, c) { const d = document.createElement('div'); d.className = 'step' + (c ? ' ' + c : ''); d.textContent = m; log.appendChild(d); }
    function setBar(p) { bar.style.width = p + '%'; }
    function run() {
      btn.disabled = true; log.innerHTML = ''; setBar(5);
      step('Чтение «' + chosen.name + '»…');
      const reader = new FileReader();
      reader.onload = function(e) {
        const b64 = e.target.result.split(',')[1];
        setBar(20);
        step('Загрузка в Drive…');
        google.script.run
          .withSuccessHandler(function(res) {
            setBar(45); step('OK: ' + res.name, 'ok');
            const mode = getMode();
            if (mode === 'inplace') {
              step('Pipeline…');
              google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).runPipelineFromUI(res.fileId, res.name);
            } else {
              const pn = document.getElementById('productName').value.trim();
              const su = document.getElementById('ourSku').value.trim();
              step('Создание копии…');
              google.script.run.withSuccessHandler(onDone).withFailureHandler(onFail).runPipelineWithCopyFromUI(res.fileId, res.name, pn, su);
            }
          })
          .withFailureHandler(onFail)
          .uploadXlsxAndConvert({ base64: b64, mimeType: chosen.type, name: chosen.name });
      };
      reader.readAsDataURL(chosen);
    }
    function onDone(r) { setBar(100); step('Готово за ' + (r.duration/1000).toFixed(1) + 'с', 'ok'); btn.disabled = false; }
    function onFail(err) { step('Ошибка: ' + err.message, 'err'); btn.disabled = false; }
  </script>
</body>
</html>
