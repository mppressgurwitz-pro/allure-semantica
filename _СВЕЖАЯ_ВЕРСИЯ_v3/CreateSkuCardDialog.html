<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <style>
    body { font-family: Arial, sans-serif; font-size: 13px; margin: 12px; color: #222; }
    label { display: block; margin-top: 10px; font-weight: bold; }
    input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 8px; }
    .hint { font-weight: normal; color: #666; font-size: 11px; }
    .btns { margin-top: 16px; text-align: right; }
    button { padding: 8px 14px; margin-left: 8px; cursor: pointer; }
    #status { margin-top: 12px; color: #c00; white-space: pre-wrap; }
    #preview { display: none; margin-top: 12px; padding: 10px; background: #f5f5f5; border-radius: 4px; }
    #preview dl { margin: 0; }
    #preview dt { font-weight: bold; margin-top: 6px; }
    #preview dd { margin: 2px 0 0 0; }
    #success { display: none; margin-top: 12px; color: #060; }
    #success a { word-break: break-all; }
    #stepInput { display: block; }
    #stepPreview { display: none; }
  </style>
</head>
<body>
  <h3>➕ Создать карточку SKU</h3>
  <p class="hint">Данные из «Шаблон_INCI_для_Маши» → лист SKU_INCI (колонка F).</p>

  <div id="stepInput">
    <label>Внутренний код 1С</label>
    <input id="internalCode" placeholder="SH0003" autofocus />
    <div class="btns">
      <button type="button" onclick="google.script.host.close()">Отмена</button>
      <button type="button" id="btnLookup" onclick="doLookup()">Создать карточку</button>
    </div>
  </div>

  <div id="stepPreview">
    <div id="preview"></div>
    <div class="btns">
      <button type="button" onclick="backToInput()">Назад</button>
      <button type="button" onclick="google.script.host.close()">Отмена</button>
      <button type="button" id="btnConfirm" onclick="doConfirm()">Подтвердить создание</button>
    </div>
  </div>

  <div id="status"></div>
  <div id="success">
    <strong>Карточка создана</strong><br>
    <a id="sheetLink" href="#" target="_blank"></a>
  </div>

  <script>
    var pendingCode = '';

    function doLookup() {
      var status = document.getElementById('status');
      status.textContent = '';
      document.getElementById('success').style.display = 'none';
      var code = document.getElementById('internalCode').value.trim();
      if (!code) {
        status.textContent = 'Введите внутренний код 1С';
        return;
      }
      document.getElementById('btnLookup').disabled = true;
      status.textContent = 'Ищем в Шаблон_INCI…';
      google.script.run
        .withSuccessHandler(onLookupOk)
        .withFailureHandler(onFail)
        .lookupSkuInciForCreateCard_(code);
    }

    function onLookupOk(res) {
      document.getElementById('btnLookup').disabled = false;
      var status = document.getElementById('status');
      if (!res || !res.ok) {
        status.textContent = (res && res.error) ? res.error : 'SKU не найден';
        return;
      }
      pendingCode = res.preview.internalCode;
      status.textContent = '';
      renderPreview(res.preview);
      document.getElementById('stepInput').style.display = 'none';
      document.getElementById('stepPreview').style.display = 'block';
    }

    function renderPreview(p) {
      var inci = p.hasInci
        ? ('да' + (p.inciPreview ? ' — ' + p.inciPreview + '…' : ''))
        : 'нет';
      var photos = p.photosFolderId
        ? ('<a href="' + esc(p.photosFolderUrl || '#') + '" target="_blank">' + esc(p.photosFolderId) + '</a>')
        : '—';
      document.getElementById('preview').innerHTML =
        '<dl>' +
        '<dt>Код</dt><dd>' + esc(p.internalCode) + '</dd>' +
        '<dt>Название</dt><dd>' + esc(p.name) + '</dd>' +
        '<dt>Бренд</dt><dd>' + esc(p.brand) + '</dd>' +
        '<dt>nmID WB Quantum</dt><dd>' + esc(p.nmid_wb_quantum) + '</dd>' +
        '<dt>nmID WB Асмус</dt><dd>' + esc(p.nmid_wb_asmus) + '</dd>' +
        '<dt>SKU Ozon Quantum</dt><dd>' + esc(p.sku_ozon_quantum) + '</dd>' +
        '<dt>SKU Ozon Асмус</dt><dd>' + esc(p.sku_ozon_asmus) + '</dd>' +
        '<dt>INCI</dt><dd>' + inci + '</dd>' +
        '<dt>Набор</dt><dd>' + esc(p.isSet || '—') + '</dd>' +
        '<dt>Папка артов</dt><dd>' + photos + '</dd>' +
        '</dl>';
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function backToInput() {
      document.getElementById('stepPreview').style.display = 'none';
      document.getElementById('stepInput').style.display = 'block';
      pendingCode = '';
    }

    function doConfirm() {
      if (!pendingCode) return;
      var status = document.getElementById('status');
      status.textContent = 'Создаём копию в «Результаты по семантике»…';
      document.getElementById('btnConfirm').disabled = true;
      google.script.run
        .withSuccessHandler(onConfirmOk)
        .withFailureHandler(onFail)
        .createSkuCardFromMasterConfirmed_(pendingCode);
    }

    function onConfirmOk(res) {
      document.getElementById('btnConfirm').disabled = false;
      var status = document.getElementById('status');
      if (!res || !res.success) {
        status.textContent = (res && res.error) ? res.error : 'Ошибка создания';
        return;
      }
      document.getElementById('stepPreview').style.display = 'none';
      document.getElementById('stepInput').style.display = 'none';
      status.textContent = '';
      var box = document.getElementById('success');
      box.style.display = 'block';
      var a = document.getElementById('sheetLink');
      a.href = res.sheetUrl;
      a.textContent = res.sheetUrl;
    }

    function onFail(err) {
      document.getElementById('btnLookup').disabled = false;
      document.getElementById('btnConfirm').disabled = false;
      document.getElementById('status').textContent = err.message || String(err);
    }
  </script>
</body>
</html>
